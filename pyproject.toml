[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbench-tool-proxy"
version = "0.1.0"
description = "Semantic-aware internal tool routing, conversion budget, revocation and citation recovery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tool-proxy = "tool_proxy.cli:main"

[tool.setuptools]
packages = ["tool_proxy"]
